    #         "text": "🚨 Website Monitoring Alert",
    #         "blocks": [
    #           {
    #             "type": "header",
    #             "text": {
    #               "type": "plain_text",
    #               "text": "🚨 Website Down"
    #             }
    #           },
    #           {
    #             "type": "section",
    #             "text": {
    #               "type": "mrkdwn",
    #               "text": "*Website:* https://start.screencloud.com/\n*Status:* DOWN\n*Time:* '"$(date -u +"%Y-%m-%d %H:%M:%S UTC")"'\n\nCheck GitHub Actions for details."
    #             }
    #           },
    #           {
    #             "type": "section",
    #             "text": {
    #               "type": "mrkdwn",
    #               "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
    #             }
    #           }
    #         ]
    #       }'

    # Email notification (commented out - using Slack instead)
    # - name: Send email notification (optional)
    #   if: failure()
    #   uses: dawidd6/action-send-mail@v3
    #   with:
    #     server_address: smtp.gmail.com
    #     server_port: 587
    #     username: ${{ secrets.EMAIL_USERNAME }}
    #     password: ${{ secrets.EMAIL_PASSWORD }}
    #     subject: '🚨 Website Down: https://start.screencloud.com/'
    #     body: |
    #       Website Monitor Alert
    #       
    #       URL: https://start.screencloud.com/
    #       Status: DOWN
    #       Time: ${{ github.event.head_commit.timestamp }}
    #       
    #       View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    #       
    #       Please investigate immediately.
    #     to: ${{ secrets.ALERT_EMAIL }}
    #     from: GitHub Actions


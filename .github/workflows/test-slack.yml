name: Test Slack Notification

on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: read

jobs:
  test-slack:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test Slack Notification
      run: |
        if [ -z "${{ secrets.SLACK_BOT_TOKEN }}" ] || [ -z "${{ secrets.SLACK_CHANNEL }}" ]; then
          echo "❌ Slack secrets not configured!"
          echo ""
          echo "Please add these secrets in repository settings:"
          echo "  - SLACK_BOT_TOKEN"
          echo "  - SLACK_CHANNEL"
          exit 1
        fi
        
        echo "✅ Slack secrets found"
        echo "Testing Slack notification..."
        echo ""
        
        curl -X POST https://slack.com/api/chat.postMessage \
          -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
          -H 'Content-Type: application/json' \
          -d '{
            "channel": "${{ secrets.SLACK_CHANNEL }}",
            "text": "🧪 Test: Website Monitor Slack Integration",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🧪 Test Notification"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*This is a test message from the Website Monitor.*\n\nIf you see this, your Slack integration is working correctly! ✅\n\n*Time:* '"$(date -u +"%Y-%m-%d %H:%M:%S UTC")"'"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "When the website goes down, you will receive alerts like this automatically."
                }
              }
            ]
          }'
        
        echo ""
        echo "✅ Test message sent! Check your Slack channel."

